<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Return to DetectLab</title>
</head>
<body>
  <main>
    <h1>Return to DetectLab</h1>
    <p id="status">Returning the sign-in result to the app…</p>
    <button type="button" onclick="window.close()">Close and return to DetectLab</button>
    <p>If this window does not close, close this tab or use the app switcher to return to the DetectLab app. Do not open a new copy of the app.</p>
    <a href="/">Open DetectLab in this browser</a>
  </main>
  <script>
    (function () {
      'use strict';
      // Must match the keys in js/pwa-google-auth.js. The installed app reads
      // this record as soon as it is back in front, so the user never copies a
      // code into the login form.
      var HANDOFF_KEY = 'detectlab-google-handoff';
      var ATTEMPT_KEY = 'detectlab-google-attempt';
      var query = new URLSearchParams(location.search);
      var fragment = new URLSearchParams(location.hash.slice(1));
      var code = query.get('code');
      var error = query.get('error') || fragment.get('error');
      // The attempt nonce lives in the app's own storage, not in the redirect
      // URL: Supabase rewrites the address to the project Site URL when it is
      // not allow-listed, so the callback URL stays a plain, exact path.
      var nonce = query.get('nonce') || '';
      if (!nonce) {
        try {
          var attempt = JSON.parse(localStorage.getItem(ATTEMPT_KEY) || 'null');
          if (attempt && attempt.nonce) nonce = String(attempt.nonce);
        } catch (_) {}
      }
      // Strip the code and provider errors immediately, before any external request.
      history.replaceState(null, '', location.pathname);
      var status = document.getElementById('status');
      if (!code && !error) {
        status.textContent = 'No sign-in result was received. Return to DetectLab and try again.';
        return;
      }
      // Same-origin storage is the fallback when the OS gave this window its own
      // opener: the app picks the record up when it comes back to the front.
      try {
        localStorage.setItem(HANDOFF_KEY, JSON.stringify({
          nonce: nonce || null, code: code || null, error: !!error, at: Date.now()
        }));
      } catch (_) {}
      var acknowledged = false;
      window.addEventListener('message', function (event) {
        if (event.origin !== location.origin || event.source !== window.opener || !event.data ||
            event.data.type !== 'detectlab-google-ack') return;
        if (event.data.nonce && nonce && event.data.nonce !== nonce) return;
        acknowledged = true;
      });
      try {
        if (window.opener) window.opener.postMessage({ type: 'detectlab-google-callback',
          nonce: nonce || null, code: code, error: !!error }, location.origin);
      } catch (_) {}
      setTimeout(function () {
        if (error) {
          status.textContent = 'Google sign-in was cancelled or failed. Return to DetectLab and try again.';
        } else if (acknowledged) {
          status.textContent = 'Signed in. Return to DetectLab.';
        } else {
          status.textContent = 'Sign-in result sent. Return to the original DetectLab app to finish signing in.';
        }
        // Closing is best-effort: some platforms ignore it, which is harmless
        // now that the result is already waiting for the app.
        setTimeout(function () { try { window.close(); } catch (_) {} }, 400);
      }, 1200);
    })();
  </script>
</body>
</html>
